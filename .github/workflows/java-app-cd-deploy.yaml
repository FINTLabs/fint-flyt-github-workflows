name: Java App CD Deploy

on:
  workflow_call:
    inputs:
      deploy-targets:
        description: JSON array with org and cluster deploy targets.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  image:
    name: Resolve image
    # head_branch also matches fork pull requests from a branch named main, so require a push in this repository.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - name: Resolve image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image_name="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image-ref=ghcr.io/${image_name}:${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: image
    uses: FINTLabs/fint-flyt-github-workflows/.github/workflows/java-app-deploy-matrix.yaml@main
    permissions:
      contents: read
      packages: read
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      deploy-targets: ${{ inputs.deploy-targets }}
    secrets: inherit
