name: Java App Deploy AKS

on:
  workflow_call:
    inputs:
      org:
        description: Kubernetes namespace/organisation to deploy to.
        required: true
        type: string
      cluster:
        description: AKS cluster name.
        required: true
        type: string
      image-ref:
        description: Full GHCR image reference to deploy.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.org }} to ${{ inputs.cluster }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.cluster }}-${{ inputs.org }}
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine environment
        id: environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLUSTER: ${{ inputs.cluster }}
        with:
          script: return process.env.CLUSTER.split('-')[1];
          result-encoding: string

      - name: Determine resource group
        id: resource-group
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ steps.environment.outputs.result }}
        with:
          script: return `rg-aks-${process.env.ENVIRONMENT}`;
          result-encoding: string

      - name: Validate overlay path
        run: |
          overlay_path="kustomize/overlays/${{ inputs.org }}/${{ steps.environment.outputs.result }}"
          test -d "${overlay_path}"

      - name: Bake manifests
        id: bake
        uses: azure/k8s-bake@bf8bfd33b007edea820fe80983239bca24012239 # v4.1.1
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/overlays/${{ inputs.org }}/${{ steps.environment.outputs.result }}

      - name: Substitute image into baked YAML
        id: substitute
        uses: azure/k8s-artifact-substitute@158198edaa1482733b1ee54372e577c9aff7c6a8 # v2.0.0
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ inputs.image-ref }}

      - name: Copy substituted manifest into workspace
        id: workspace-manifest
        run: |
          mkdir -p .k8s-deploy
          dest="$GITHUB_WORKSPACE/.k8s-deploy/$(basename "${{ steps.substitute.outputs.manifests }}")"
          cp "${{ steps.substitute.outputs.manifests }}" "$dest"
          echo "manifest=$dest" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets[format('AKS_{0}_FINT_GITHUB', steps.environment.outputs.result)] }}

      - name: Set AKS context
        uses: azure/aks-set-context@883bdc8d8d1d0fd87e66cc4ba6f0b618f9eb5281 # v5.0.1
        with:
          cluster-name: ${{ inputs.cluster }}
          resource-group: ${{ steps.resource-group.outputs.result }}
          admin: true
          use-kubelogin: true

      - name: Deploy to AKS
        env:
          MANIFEST: ${{ steps.workspace-manifest.outputs.manifest }}
          NAMESPACE: ${{ inputs.org }}
        run: kubectl apply -f "$MANIFEST" --namespace "$NAMESPACE"
