name: Java CodeQL

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use for the CodeQL build.
        required: false
        type: string
        default: "25"
      build-command:
        description: Gradle command used to build classes for CodeQL analysis.
        required: false
        type: string
        default: ./gradlew --no-daemon testClasses
      languages:
        description: CodeQL languages to analyze.
        required: false
        type: string
        default: java-kotlin
      category:
        description: CodeQL analysis category.
        required: false
        type: string
        default: /language:java-kotlin

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.languages }}
          build-mode: manual
          dependency-caching: true

      - name: Build for CodeQL
        run: ${{ inputs.build-command }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ inputs.category }}
