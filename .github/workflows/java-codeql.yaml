name: Java CodeQL

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use for the CodeQL build.
        required: false
        type: string
        default: "25"
      build-command:
        description: Gradle command used to build classes for CodeQL analysis.
        required: false
        type: string
        default: ./gradlew --no-daemon testClasses
      languages:
        description: CodeQL languages to analyze.
        required: false
        type: string
        default: java-kotlin
      category:
        description: CodeQL analysis category.
        required: false
        type: string
        default: /language:java-kotlin

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: wrapper

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.languages }}
          build-mode: manual
          dependency-caching: true

      - name: Build for CodeQL
        run: ${{ inputs.build-command }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: ${{ inputs.category }}
