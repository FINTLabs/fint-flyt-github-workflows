name: Java Dependency Submission

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use for the Gradle dependency resolution.
        required: false
        type: string
        default: "25"
      additional-arguments:
        description: Additional arguments to pass to Gradle when resolving dependencies.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          additional-arguments: ${{ inputs.additional-arguments }}
