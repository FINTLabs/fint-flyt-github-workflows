name: Java Library CI

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use for the Gradle build.
        required: false
        type: string
        default: "25"
      gradle-command:
        description: Gradle command used to validate the library.
        required: false
        type: string
        default: ./gradlew build

permissions:
  contents: read

jobs:
  build:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper

      - name: Run Gradle validation
        run: ${{ inputs.gradle-command }}